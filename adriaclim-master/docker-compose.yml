version: "3.9"

services:
  migrator:
    build:
      context: .
    container_name: adriapp_migrator
    volumes:
      - ./code:/code
      - /static:/static
    entrypoint: /entrypoint.sh
    environment:
      - DB_HOST=db
      - DB_NAME=$POSTGRES_NAME
      - DB_USER=$POSTGRES_USER
      - DB_PASS=$POSTGRES_PASSWORD
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=$SECRET_KEY
    depends_on:
      - db
      - redis

  django:
    build:
      context: .
    container_name: adriapp_django
    command: sh -c "cd adria_project_backend && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./code:/code
      - /static:/static
    environment:
      - DB_HOST=db
      - DB_NAME=$POSTGRES_NAME
      - DB_USER=$POSTGRES_USER
      - DB_PASS=$POSTGRES_PASSWORD
      - SECRET_KEY=$SECRET_KEY
    depends_on:
      migrator:
        condition: service_completed_successfully

  celery:
    build:
      context: .
    container_name: adriapp_celery
    command: >
      sh -c "cd adria_project_backend && celery -A AdriaProject worker --loglevel=info -Q my_queue -c 25"
    volumes:
      - ./code:/code
    environment:
      - DB_HOST=db
      - DB_NAME=$POSTGRES_NAME
      - DB_USER=$POSTGRES_USER
      - DB_PASS=$POSTGRES_PASSWORD
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=$SECRET_KEY
    depends_on:
      migrator:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: .
    container_name: adriapp_celery_beat
    command: >
      sh -c "cd adria_project_backend && rm -f celerybeat-schedule && celery -A AdriaProject beat -l info"
    volumes:
      - ./code:/code
    environment:
      - DB_HOST=db
      - DB_NAME=$POSTGRES_NAME
      - DB_USER=$POSTGRES_USER
      - DB_PASS=$POSTGRES_PASSWORD
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=$SECRET_KEY
    depends_on:
      migrator:
        condition: service_completed_successfully

  angular:
    build:
      context: ./code/adria_project_frontend
      dockerfile: Dockerfile.dev
    container_name: adriapp_angular
    ports:
      - "4200:4200"
    environment:
      - WDS_SOCKET_PORT=0
    depends_on:
      - django

  nginx:
    build: ./nginx
    container_name: adriapp_nginx
    volumes:
      - /static:/static
      # - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf   # per sviluppo
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf  # per produzione
      # - ./code/adria_project_frontend/dist/adria-project-front:/usr/share/nginx/html   # per produzione check se è da togliere
    ports:
      - "8000:8000"
    depends_on:
      - django
      # - angular   # in dev serve Angular separato, in prod questa riga va tolta

  redis:
    image: redis:alpine
    container_name: adriapp_redis
    ports:
      - "6379:6379"

  db:
    image: postgis/postgis:13-3.3
    container_name: adriapp_postgres
    ports:
      - "5433:5433"
      - "5532:5432"
    environment:
      - POSTGRES_DB=$POSTGRES_NAME
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - PGDATA=/var/lib/postgresql/data
      - SECRET_KEY=$SECRET_KEY
    volumes:
      - postgres-volume:/var/lib/postgresql/data:rw

volumes:
  postgres-volume:


