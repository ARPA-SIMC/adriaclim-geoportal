version: "3.9"

services:
  migrator:
    build:
      context: .
    container_name: adriapp_migrator
    volumes:
      - ./code:/code
      - /static:/static
    entrypoint: /entrypoint.sh
    env_file:
      - ./code/adria_project_backend/.env
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_NAME:-adria_db}
      - DB_USER=${POSTGRES_USER:-adria_user}
      - DB_PASS=${POSTGRES_PASSWORD:-adria_pass}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  django:
    build:
      context: .
    container_name: adriapp_django
    command: sh -c "cd adria_project_backend && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./code:/code
      - /static:/static
    env_file:
      - ./code/adria_project_backend/.env
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_NAME:-adria_db}
      - DB_USER=${POSTGRES_USER:-adria_user}
      - DB_PASS=${POSTGRES_PASSWORD:-adria_pass}
    depends_on:
      migrator:
        condition: service_completed_successfully

  celery:
    build:
      context: .
    container_name: adriapp_celery
    command: >
      sh -c "cd adria_project_backend && celery -A AdriaProject worker --loglevel=info -Q my_queue -c 25"
    volumes:
      - ./code:/code
    env_file:
      - ./code/adria_project_backend/.env
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_NAME:-adria_db}
      - DB_USER=${POSTGRES_USER:-adria_user}
      - DB_PASS=${POSTGRES_PASSWORD:-adria_pass}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrator:
        condition: service_completed_successfully

  celery-beat:
    build:
      context: .
    container_name: adriapp_celery_beat
    command: >
      sh -c "cd adria_project_backend && rm -f celerybeat-schedule && celery -A AdriaProject beat -l info"
    volumes:
      - ./code:/code
    env_file:
      - ./code/adria_project_backend/.env
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_NAME:-adria_db}
      - DB_USER=${POSTGRES_USER:-adria_user}
      - DB_PASS=${POSTGRES_PASSWORD:-adria_pass}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      migrator:
        condition: service_completed_successfully

  nginx:
    build: ./nginx
    container_name: adriapp_nginx
    volumes:
      - /static:/static
    ports:
      - "8000:8000"
    depends_on:
      - django
      - angular

  angular:
    build: ./code/adria_project_frontend
    container_name: adriapp_angular
    ports:
      - "4200:4200"
    environment:
      - WDS_SOCKET_PORT=0
    depends_on:
      - django

  redis:
    image: redis:alpine
    container_name: adriapp_redis
    ports:
      - "6379:6379"

  db:
    image: postgis/postgis:13-3.3
    container_name: adriapp_postgres
    ports:
      - "5433:5433"
      - "5532:5432"
    env_file:
      - ./code/adria_project_backend/.env
    environment:
      - POSTGRES_DB=${POSTGRES_NAME:-adria_db}
      - POSTGRES_USER=${POSTGRES_USER:-adria_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-adria_pass}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres-volume:/var/lib/postgresql/data:rw

volumes:
  postgres-volume:

