version: "3.9"

services:
  django:
    build:
      context: .
    container_name: adriapp_django
    expose:
      - "8000"
    volumes:
      - ./code:/code
      - /static:/static
    entrypoint: /entrypoint.sh
    command: sh -c "cd adria_project_backend && python manage.py runserver 0.0.0.0:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=$POSTGRES_NAME
      - DB_USER=$POSTGRES_USER
      - DB_PASS=$POSTGRES_PASSWORD
    depends_on:
      - db
      - redis

  nginx:
    build: ./nginx
    container_name: adriapp_nginx
    volumes:
      - /static:/static
    ports:
      - "8000:8000"
      # - "80:80"
    depends_on:
      - django
  #     - angular
  
  # angular:
  #   build: ./code/adria_project_frontend
  #   container_name: adriapp_angular
  #   ports:
  #     - "4200:4200"
  #   depends_on:
  #     - django
  #   environment:
  #     - WDS_SOCKET_PORT=0

  redis:
    image: redis:alpine
    container_name: adriapp_redis
    ports:
      - "6379:6379"

  db:
    image: postgis/postgis:13-3.3
    container_name: adriapp_postgres
    ports:
      - "5433:5433"
      - "5532:5432"
    environment:
      - POSTGRES_DB=$POSTGRES_NAME
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres-volume:/var/lib/postgresql/data:rw

  celery:
    restart: always
    build:
      context: .
    command: >
      sh -c "cd adria_project_backend && celery -A AdriaProject worker --loglevel=info -Q my_queue -c 25 && celery -A AdriaProject inspect scheduled"
    environment:
      - DB_HOST=db
      - DB_NAME=$POSTGRES_NAME
      - DB_USER=$POSTGRES_USER
      - DB_PASS=$POSTGRES_PASSWORD
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./code:/code
    container_name: adriapp_celery
    depends_on:
      - db
      - redis

  celery-beat:
    restart: always
    build:
      context: .
    command: >
      sh -c "cd adria_project_backend && rm -f celerybeat-schedule && celery -A AdriaProject beat -l info"
    environment:
      - DB_HOST=db
      - DB_NAME=$POSTGRES_NAME
      - DB_USER=$POSTGRES_USER
      - DB_PASS=$POSTGRES_PASSWORD
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./code:/code
    container_name: adriapp_celery_beat
    depends_on:
      - db
      - redis

volumes:
  postgres-volume:
