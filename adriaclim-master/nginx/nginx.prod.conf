# ==============================================
# 🌍 NGINX CONFIG - ADRIACLIM (NO HTTPS TEMPORANEO)
# ==============================================

# Upstream interno per Django
upstream django {
    server adriapp_django:8000;
}

server {
    listen 80;
    server_name 172.19.99.34 geoportale-adriaclim.datamb.it;

    client_max_body_size 10G;

    # ----------------------------
    # FRONTEND ANGULAR (BUILD STATICO)
    # ----------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------
    # BACKEND DJANGO - API E DATASET
    # ----------------------------
    location /dataset/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ----------------------------
    # FILE STATICI DJANGO
    # ----------------------------
    location /static/ {
        alias /static/;
        autoindex on;
    }

    # ----------------------------
    # FILE MEDIA DJANGO (OPZIONALE)
    # ----------------------------
    location /media/ {
        alias /media/;
    }

    # ----------------------------
    # TIMEOUT (per dataset pesanti)
    # ----------------------------
    proxy_read_timeout 99999;
    proxy_connect_timeout 99999;
    proxy_send_timeout 99999;
}
