rx1day: "Maximum 1-day precipitation amount within the selected period."
rx5day: "Maximum 5-day accumulated precipitation amount within the selected period."
prcptot: "Total accumulated precipitation over the selected time period."
r95p: "Amount of precipitation from days exceeding the 95th percentile of the reference period."
r99p: "Amount of precipitation from days exceeding the 99th percentile of the reference period."
sdii: "Simple Daily Intensity Index (total precipitation divided by number of wet days)."
cdd: "Maximum number of consecutive dry days (precipitation < 1 mm)."
cwd: "Maximum number of consecutive wet days (precipitation ≥ 1 mm)."
r95ptot: "Total precipitation amount accumulated on very wet days (daily precipitation > 95th percentile of the reference period)."

txx: "Maximum value of daily maximum temperature."
txn: "Minimum value of daily maximum temperature."
tnx: "Maximum value of daily minimum temperature."
tnn: "Minimum value of daily minimum temperature."
txmean: "Mean daily maximum temperature."
tnmean: "Mean daily minimum temperature."
tg: "Mean daily temperature."
su: "Number of summer days (daily maximum temperature above threshold)."
su30: "Number of days with daily maximum temperature above 30°C."
tr: "Number of tropical nights (daily minimum temperature above threshold)."
tnd: "Number of days with minimum temperature below 0°C (frost days) within the selected period."
tx90p: "Percentage of days when daily maximum temperature (TX) exceeds its 90th percentile computed over the reference period."
txd: "Number of days when daily maximum temperature (TX) exceeds a fixed threshold (dataset-dependent)."

hwn: "Number of heatwave events during the selected period."
hwdi: "Heat Wave Duration Index (total duration of heatwave events)."
wsdi: "Warm Spell Duration Index (number of days in warm spells)."
cwdi: "Cold Spell Duration Index (number of days in cold spells)."

tdd: "Total Degree Days computed over the selected period."
gdd: "Growing Degree Days accumulated over the selected period."

trend: "Linear trend of the indicator over the selected time period."
anomaly: "Anomaly relative to the climatological reference period (observed minus reference mean)."
pvalue: "P-value associated with the trend estimate."
signif: "Statistical significance of the computed trend."
std_error: "Standard error associated with the estimated trend."
mean: "Mean value of the indicator over the selected period."
avg: "Average value computed over the selected period."

mh1: "Standardized Precipitation Index (SPI)."
mh2: "Soil moisture anomaly index."
mh3: "Temperature-humidity combined index."
rd1: "Very wet days index based on the 95th percentile."
rd2: "Precipitation-related extreme index."
rd2_p95: "Precipitation index based on the 95th percentile."
rd2_q1: "Precipitation first quartile index."

bvf: "Brunt–Väisälä Frequency, a measure of water column stratification."
maxbv: "Maximum Brunt–Väisälä Frequency, indicating strongest stratification."
par: "Photosynthetically Active Radiation available for photosynthesis."
salinity: "Salinity of seawater."
temperature: "Water or air temperature."
u_velocity: "Zonal (east–west) velocity component."
v_velocity: "Meridional (north–south) velocity component."
wave_height: "Significant wave height."
wave_period: "Mean wave period."
wave_direction: "Mean wave direction."

p: "P-value associated with the trend estimate."
p_value: "P-value associated with the trend estimate."
stderr: "Standard error associated with the estimated trend."

