{% extends 'base.html' %}
{% load static %}

{% block title %}{{ welJson.title }}{% endblock %}

{% block content %}
<div class="main-content col-12">
  <div class="col-12">
    <div class="mat-toolbar bg-primary text-white py-3">
      <div class="d-flex justify-content-center align-items-center gap-5 col-12 toolbar-buttons">
        <a class="btn" href="/mapNewMenu" style="color: #fff; background-color: rgba(0, 221, 221, 0.795);">
          🌐 <span class="text-menu"> Geoportal map </span>
        </a>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="row justify-content-between pt-3">
      <div class="col-2 d-flex justify-content-center align-items-center">
        <a class="col btn btn-primary" href="{{ welJson.web_project }}">Web project</a>
      </div>

      <div class="col arrow"></div>

      <div class="col-2 d-flex justify-content-center align-items-center">
        <a class="col btn btn-primary" href="{{ welJson.toolkit }}">Toolkit</a>
      </div>
    </div>

    <div class="row">
      <h2 class="text-center col">{{ welJson.title }}</h2>
    </div>
    <div class="row">
      <p class="col">{{ welJson.text }}</p>
    </div>
  </div>
</div>
{% endblock %}
