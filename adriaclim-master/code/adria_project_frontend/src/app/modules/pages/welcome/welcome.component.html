<div class="welcome-page">

  <!-- HERO -->
  <section class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">

      <div class="brand-logo">
        <svg class="brand-logo__mark" viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="brandWaveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#5fd4e0"/>
              <stop offset="100%" stop-color="#0b3d63"/>
            </linearGradient>
          </defs>
          <path d="M4 40 C 22 18, 38 18, 50 32 C 62 46, 78 46, 90 28" fill="none" stroke="url(#brandWaveGradient)" stroke-width="7" stroke-linecap="round"/>
          <path d="M20 46 C 38 24, 54 24, 66 38 C 78 52, 94 52, 106 34" fill="none" stroke="url(#brandWaveGradient)" stroke-width="7" stroke-linecap="round"/>
        </svg>
        <div class="brand-logo__wordmark">
          <span class="brand-logo__name">AdriaClim</span><span class="brand-logo__suffix">Plus</span>
        </div>
      </div>

      <h1 class="hero-title">AdriaClimPlus Geoportal</h1>

      <div class="hero-divider"></div>

      <button class="btn-enter" type="button" (click)="goToMap()">
        <mat-icon>map</mat-icon>
        <span>GEOPORTAL MAP</span>
        <mat-icon>arrow_forward</mat-icon>
      </button>

    </div>

    <div class="hero-wave" aria-hidden="true">
      <svg class="hero-wave__back" viewBox="0 0 1440 100" preserveAspectRatio="none">
        <path d="M0,55 C180,15 360,15 540,45 C720,75 900,75 1080,45 C1260,15 1350,15 1440,35 L1440,100 L0,100 Z" fill="#0f5c78" fill-opacity="0.55"/>
      </svg>
      <svg class="hero-wave__front" viewBox="0 0 1440 100" preserveAspectRatio="none">
        <path d="M0,45 C220,85 420,5 660,35 C860,60 1040,85 1220,50 C1320,32 1380,25 1440,35 L1440,100 L0,100 Z" fill="#ffffff"/>
      </svg>
    </div>
  </section>

  <!-- OFFICIAL RESOURCES -->
  <section class="resources">

    <div class="resources-main">
      <h2 class="resources-title">Official Resources</h2>
      <div class="resources-title-divider"></div>

      <div class="resources-grid">
        <a *ngFor="let resource of resources"
           class="resource-btn"
           [href]="resource.url"
           target="_blank"
           rel="noopener noreferrer">
          <mat-icon class="resource-icon">{{ resource.icon }}</mat-icon>
          <span class="resource-text">
            <strong>{{ resource.titleLine1 }}</strong>
            <span>{{ resource.titleLine2 }}</span>
          </span>
          <mat-icon class="resource-arrow">arrow_forward</mat-icon>
        </a>
      </div>
    </div>

    <div class="resources-footer">
      <div class="footer-divider"></div>

      <div class="footer-logos">
        <div class="footer-logo footer-logo--interreg">
          <span class="interreg-name">Interreg</span>
          <span class="interreg-sub">Italy - Croatia</span>
        </div>

        <div class="footer-logo footer-logo--eu">
          <div class="eu-flag">
            <span class="eu-star" *ngFor="let star of euStars"></span>
          </div>
          <span class="eu-text">Co-funded by<br>the European Union</span>
        </div>

        <div class="footer-divider-vertical"></div>

        <div class="footer-logo footer-logo--brand">
          <span class="brand-logo__name">AdriaClim</span><span class="brand-logo__suffix">Plus</span>
        </div>
      </div>
    </div>

  </section>

</div>
